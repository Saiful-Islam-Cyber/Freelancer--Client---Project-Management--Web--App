{% extends "base.html" %}
{% block content %}
<h2>Manage Clients</h2>

<form method="POST" action="{{ url_for('clients') }}">
    <input type="text" name="name" placeholder="Client Name" required>
    <input type="email" name="email" placeholder="Email Address" required>
    <input type="text" name="company" placeholder="Company (Optional)">
    <button type="submit">Add Client</button>
</form>

<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Company</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for c in clients %}
        <tr>
            <td>{{ c.name }}</td>
            <td>{{ c.email }}</td>
            <td>{{ c.company or "-" }}</td>
            <td>
                <a href="{{ url_for('edit_client', client_id=c.id) }}" class="btn">Edit</a>
                <form method="POST" action="{{ url_for('delete_client', client_id=c.id) }}" style="display:inline;">
                    <button type="submit" class="btn btn-danger" onclick="return confirm('Deleting a client also deletes their projects. Continue?')">Delete</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="4">No clients added yet.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
