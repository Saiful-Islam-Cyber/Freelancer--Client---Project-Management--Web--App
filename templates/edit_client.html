{% extends "base.html" %}
{% block content %}
<h2>Edit Client</h2>
<form method="POST">
    <p>Name: <input type="text" name="name" value="{{ client.name }}" required></p>
    <p>Email: <input type="email" name="email" value="{{ client.email }}" required></p>
    <p>Company: <input type="text" name="company" value="{{ client.company }}"></p>
    <button type="submit">Save Changes</button>
    <a href="{{ url_for('clients') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
